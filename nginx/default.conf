server {
    listen       80;
    listen       [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Serve files; fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lightweight cache headers for static assets.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # A simple endpoint used by the container HEALTHCHECK / load balancers.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Don't leak the nginx version in error pages / headers.
    server_tokens off;
}
