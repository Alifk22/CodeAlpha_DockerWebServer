services:
  webserver:
    build: .
    image: codealpha-webserver:latest
    container_name: codealpha-webserver
    ports:
      - "8080:80"          # host 8080 -> container 80
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
